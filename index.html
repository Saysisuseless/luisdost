<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DOST-SEI Mock Exam 2 (45 items)</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1c2321;--mute:#5d6a66;--line:#d9dfdb;--acc:#1f5f4a;--accbg:#e3f1ea;--ok:#1d7a3e;--okbg:#e2f4e8;--bad:#b3261e;--badbg:#fbe7e5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131816;--card:#1c2320;--ink:#e8ede9;--mute:#9aa8a2;--line:#2f3a36;--acc:#6fcfa5;--accbg:#1f3a2f;--ok:#6fd48f;--okbg:#1b3524;--bad:#ff8b82;--badbg:#3d2220}}
:root[data-theme="dark"]{--bg:#131816;--card:#1c2320;--ink:#e8ede9;--mute:#9aa8a2;--line:#2f3a36;--acc:#6fcfa5;--accbg:#1f3a2f;--ok:#6fd48f;--okbg:#1b3524;--bad:#ff8b82;--badbg:#3d2220}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:1.5rem;margin:8px 0 4px}
.sub{color:var(--mute);margin:0 0 12px;font-family:system-ui,sans-serif;font-size:.9rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;font-family:system-ui,sans-serif;font-size:.9rem}
.prog{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
h2{font-size:1.15rem;margin:28px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--acc)}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.q p{margin:0 0 8px}
.q b.n{color:var(--acc);margin-right:4px}
label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;margin:4px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-family:system-ui,sans-serif;font-size:.95rem}
label:hover{background:var(--accbg)}
input{margin-top:3px;accent-color:var(--acc)}
label.sel{background:var(--accbg);border-color:var(--acc)}
label.right{background:var(--okbg);border-color:var(--ok)}
label.wrong{background:var(--badbg);border-color:var(--bad)}
.ex{margin-top:8px;padding:8px 10px;border-left:3px solid var(--acc);background:var(--accbg);font-family:system-ui,sans-serif;font-size:.9rem}
.ex.w{border-color:var(--bad)}
button{font:600 1rem system-ui,sans-serif;padding:12px 20px;border-radius:8px;border:0;background:var(--acc);color:#fff;cursor:pointer}
:root:not([data-theme="light"]) button{color:#0b1a14}
button.alt{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.res{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:16px 0;font-family:system-ui,sans-serif}
.big{font-size:2rem;font-weight:700;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
textarea{width:100%;font:.9rem monospace;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-top:8px}
#msg{color:var(--bad);font-family:system-ui,sans-serif;margin-top:8px;min-height:1.2em}
</style>
</head>
<body>
<main>
<h1>DOST-SEI mock exam 2</h1>
<p class="sub">45 new items, about 50 minutes. Practice set made by Claude, not actual DOST questions. Pick one answer per item, then submit everything at once. Use g = 10 m/s² where needed.</p>
<div class="bar"><span id="cnt">0/45 answered</span><div class="prog"><i id="pb"></i></div></div>
<form id="f" onsubmit="return false"></form>
<div id="msg"></div>
<div class="row"><button id="sub" type="button">Submit all answers</button></div>
<div id="out"></div>
</main>
<script>
var S=["Creative Reasoning and Language","Science","Mathematics"];
var Q=[
[0,"A seesaw is balanced. A 40 kg child sits 3 m from the pivot. How far from the pivot must a 60 kg child sit on the other side?",["1.5 m","2 m","4.5 m","2.5 m"],1,"Balance rule: 40 × 3 = 60 × d, so d = 120 ÷ 60 = 2 m. The heavier child sits closer."],
[0,"An ideal pulley system with 3 supporting rope segments needs 50 N of effort. What load can it lift?",["50 N","100 N","150 N","200 N"],2,"Load = effort × number of segments = 50 × 3 = 150 N."],
[0,"Gear A (20 teeth) drives Gear B (10 teeth). If A turns 2 full times, how many times does B turn?",["4","2","1","8"],0,"A passes 20 × 2 = 40 teeth. B has 10 teeth, so 40 ÷ 10 = 4 turns. The smaller gear spins faster."],
[0,"A battery powers two identical bulbs in series. A third identical bulb is added in series. What happens to the brightness of the first two?",["Brighter","Dimmer","Same","They go out"],1,"More bulbs in series means more resistance, so less current flows and every bulb gets dimmer."],
[0,"One ball is dropped and another is thrown horizontally from the same height at the same moment (no air resistance). Which hits the ground first?",["The dropped ball","The thrown ball","Cannot be determined","Both at the same time"],3,"Vertical motion is independent of horizontal motion. Both fall with the same acceleration, so they land together."],
[0,"A 4 × 4 × 4 cube is painted on all outside faces, then cut into 64 small cubes. How many small cubes have exactly one painted face?",["24","8","16","32"],0,"One-face cubes lie in the middle of each face: 2 × 2 = 4 per face. Six faces give 6 × 4 = 24."],
[0,"You face east, turn left 90°, then turn right 180°, then turn left 90°. Which way do you face now?",["North","South","East","West"],2,"East → left 90° = North → right 180° = South → left 90° (from South) = East."],
[0,"Complete the series: 3, 6, 11, 18, 27, ___",["36","40","39","38"],3,"Differences are 3, 5, 7, 9, so the next is +11: 27 + 11 = 38."],
[0,"COMPASS : DIRECTION :: CLOCK : ?",["time","hour","wall","battery"],0,"A compass is a tool that shows direction. A clock is a tool that shows time."],
[0,"GENEROUS : STINGY :: BRAVE : ?",["heroic","cowardly","strong","bold"],1,"They are opposites: generous/stingy, so brave/cowardly."],
[0,"Neither the teacher nor the students ___ ready for the test.",["are","is","was","be"],0,"With neither…nor, the verb agrees with the noun closest to it. Students is plural, so are."],
[0,"She can ___ the piano very well.",["plays","played","playing","play"],3,"After a modal (can, will, may, should), the verb stays in its base form: play."],
[0,"“The mayor’s speech was so lucid that even the children understood it.” Lucid means:",["confusing","long","angry","clear"],3,"Context clue: even the children understood, so the speech was clear."],
[0,"Bees pollinate flowers as they gather nectar. This helps plants make seeds and fruits. Without bees, many crops would produce much less food. What is the main idea?",["Bees make honey","Flowers need sunlight","Bees are important to crop production because they pollinate plants","Fruits are healthy"],2,"The main idea covers every sentence: bees pollinate, which helps plants produce food."],
[0,"Which word is closest in meaning to “abundant”?",["scarce","tiny","plentiful","hidden"],2,"Abundant means existing in large amounts, which is plentiful. Scarce is the opposite."],
[1,"A 0.5 kg ball moves at 6 m/s. What is its kinetic energy?",["3 J","9 J","18 J","1.5 J"],1,"KE = ½mv² = ½ × 0.5 × 36 = 9 J."],
[1,"A stone is dropped from rest (no air resistance). How fast is it moving after 3 s?",["3 m/s","15 m/s","90 m/s","30 m/s"],3,"v = gt = 10 × 3 = 30 m/s."],
[1,"A motor lifts a 50 kg load 6 m in 10 s. What is its power output?",["30 W","3000 W","300 W","500 W"],2,"Work = mgh = 50 × 10 × 6 = 3000 J. Power = work ÷ time = 3000 ÷ 10 = 300 W."],
[1,"A book rests on a table. Which force is the Newton’s-third-law reaction to Earth’s gravitational pull on the book?",["The table’s push on the book","The book’s gravitational pull on Earth","The table’s weight","Friction"],1,"Action-reaction pairs act on different objects with the same type of force. Earth pulls the book, so the book pulls Earth. (The table’s push is a different force.)"],
[1,"A constant force of 20 N acts on an object for 3 s. What is the impulse?",["60 N·s","17 N·s","6.7 N·s","23 N·s"],0,"Impulse = force × time = 20 × 3 = 60 N·s."],
[1,"A gas at constant temperature occupies 6 L at 2 atm. What is its volume at 1 atm?",["3 L","6 L","8 L","12 L"],3,"Boyle’s law: P₁V₁ = P₂V₂, so 2 × 6 = 1 × V, giving V = 12 L."],
[1,"What is the mass of 0.25 mol of CO₂ (molar mass 44 g/mol)?",["176 g","0.0057 g","11 g","44 g"],2,"mass = moles × molar mass = 0.25 × 44 = 11 g."],
[1,"How many electrons does a Mg²⁺ ion (atomic number 12) have?",["12","10","14","2"],1,"A neutral Mg atom has 12 electrons. The 2+ charge means it lost 2, leaving 10."],
[1,"A cell is placed in a hypotonic solution. It will:",["shrink","stay the same","divide","swell"],3,"Hypotonic means less solute outside, so water enters the cell and it swells. (Hippo = fat.)"],
[1,"A DNA template strand reads 3′–ATG CCA–5′. Which mRNA strand is made?",["5′–UAC GGU–3′","5′–TAC GGT–3′","3′–UAC GGU–5′","5′–AUG CCA–3′"],0,"Pair A→U, T→A, G→C, C→G, and the mRNA runs in the opposite direction. This gives 5′–UAC GGU–3′. RNA has U, never T."],
[1,"A heterozygous tall plant (Tt) is crossed with a short plant (tt). What fraction of the offspring are short?",["0","1/4","1/2","3/4"],2,"Tt × tt gives Tt, Tt, tt, tt. Two of four are tt, which is 1/2."],
[1,"Which seismic wave arrives first at a monitoring station?",["S-wave","P-wave","Love wave","Rayleigh wave"],1,"P-waves (primary) are the fastest body waves, so they arrive first."],
[1,"The ozone layer is found in the:",["mesosphere","troposphere","thermosphere","stratosphere"],3,"Ozone absorbs UV in the stratosphere, which is why temperature rises with height there."],
[1,"An igneous rock formed from magma that cooled slowly underground, with large crystals, is most likely:",["Basalt","Obsidian","Granite","Pumice"],2,"Slow cooling underground gives large crystals (intrusive igneous): granite. Basalt, obsidian, and pumice cool quickly at the surface."],
[1,"Which moon phase comes right after the full moon?",["Waxing gibbous","First quarter","New moon","Waning gibbous"],3,"The sequence is new → waxing crescent → first quarter → waxing gibbous → full → waning gibbous → last quarter."],
[2,"Mia is twice as old as Leo. Five years ago the sum of their ages was 23. How old is Mia now?",["11","22","33","28"],1,"Leo = l, Mia = 2l. (2l − 5) + (l − 5) = 23, so 3l = 33 and l = 11. Mia = 22."],
[2,"What is the product of the roots of 2x² − 7x + 12 = 0?",["12","−7/2","7/2","6"],3,"Product of roots = c/a = 12/2 = 6. (The sum is −b/a = 7/2.)"],
[2,"Solve: log₃ x + log₃ (x + 6) = 3",["27","−9","3","9"],2,"x(x + 6) = 3³ = 27, so x² + 6x − 27 = 0, which factors as (x + 9)(x − 3). Reject −9 (log of a negative). x = 3."],
[2,"A right triangle has legs 8 and 15. What is the sine of the angle opposite the 15 side?",["15/17","8/17","15/8","8/15"],0,"Hypotenuse = √(8² + 15²) = √289 = 17. sin = opposite/hypotenuse = 15/17."],
[2,"Evaluate: lim (x → −1) (x² − 1)/(x + 1)",["0","−2","2","Does not exist"],1,"Factor: (x − 1)(x + 1)/(x + 1) = x − 1. At x = −1 this is −2."],
[2,"Evaluate: ∫₁² 3x² dx",["9","3","6","7"],3,"Antiderivative is x³. At 2: 8. At 1: 1. Difference: 7."],
[2,"Differentiate y = 5x⁴ − 3x.",["5x³ − 3","20x³ − 3","20x⁴ − 3","20x³"],1,"Power rule: bring the exponent down and subtract 1. 5 × 4 = 20, giving 20x³, and the derivative of 3x is 3."],
[2,"What is the sum of the interior angles of a decagon (10 sides)?",["1260°","1800°","1440°","1080°"],2,"(n − 2) × 180 = 8 × 180 = 1440°."],
[2,"An inscribed angle intercepts an arc of 100°. What is the measure of the inscribed angle?",["50°","100°","200°","25°"],0,"An inscribed angle is half its intercepted arc: 100 ÷ 2 = 50°."],
[2,"What is the volume of a cone with radius 3 and height 4? (V = ⅓πr²h)",["36π","24π","48π","12π"],3,"V = ⅓ × π × 9 × 4 = 12π."],
[2,"What is sin 60° × cos 30°?",["√3/4","1/2","1","3/4"],3,"sin 60° = √3/2 and cos 30° = √3/2. Product: (√3 × √3)/4 = 3/4."],
[2,"The mean of 4 numbers is 15. A fifth number, 20, is added. What is the new mean?",["16","15","17.5","18"],0,"The sum of the 4 numbers is 4 × 15 = 60. New sum = 80. New mean = 80 ÷ 5 = 16."],
[2,"Two cards are drawn one after the other without replacement from 4 red and 6 blue cards. What is the probability that both are blue?",["3/5","1/3","9/25","1/9"],1,"6/10 × 5/9 = 30/90 = 1/3. The second draw has one fewer blue card and one fewer card in total."],
[2,"In how many ways can a committee of 4 students be chosen from 6 students?",["15","24","360","30"],0,"Order doesn’t matter, so use a combination: C(6,4) = 6!/(4! × 2!) = 15."],
[2,"A can paint a fence in 10 hours and B in 15 hours. How long will they take working together?",["12.5 h","5 h","25 h","6 h"],3,"Rates add: 1/10 + 1/15 = 3/30 + 2/30 = 5/30 = 1/6 fence per hour, so 6 hours."]
];
var L="ABCD",A=new Array(Q.length).fill(-1),done=false;
var f=document.getElementById("f");
function build(){
 var h="",cur=-1;
 Q.forEach(function(q,i){
  if(q[0]!==cur){cur=q[0];h+="<h2>Part "+(cur+1)+": "+S[cur]+"</h2>"}
  h+="<div class=q id=q"+i+"><p><b class=n>"+(i+1)+".</b>"+q[1]+"</p>";
  q[2].forEach(function(o,j){h+="<label id=l"+i+"_"+j+"><input type=radio name=r"+i+" value="+j+"> <span><b>"+L[j]+".</b> "+o+"</span></label>"});
  h+="</div>";
 });
 f.innerHTML=h;
}
function upd(){
 var n=A.filter(function(x){return x>=0}).length;
 document.getElementById("cnt").textContent=n+"/"+Q.length+" answered";
 document.getElementById("pb").style.width=(100*n/Q.length)+"%";
}
f.addEventListener("change",function(e){
 if(done)return;
 var t=e.target,i=+t.name.slice(1),j=+t.value;A[i]=j;
 for(var k=0;k<4;k++)document.getElementById("l"+i+"_"+k).classList.toggle("sel",k===j);
 upd();
});
document.getElementById("sub").onclick=function(){
 if(done)return;
 var un=[];A.forEach(function(a,i){if(a<0)un.push(i+1)});
 var m=document.getElementById("msg");
 if(un.length&&!window._ok){m.textContent="Unanswered: "+un.join(", ")+". Guessing costs nothing on the real exam. Press Submit again to grade anyway.";window._ok=true;return}
 m.textContent="";grade();
};
function grade(){
 done=true;
 var tot=[0,0,0],cor=[0,0,0],wrong=[],str=[];
 Q.forEach(function(q,i){
  var s=q[0];tot[s]++;var a=A[i],ok=a===q[3];if(ok)cor[s]++;else wrong.push(i+1);
  str.push((i+1)+(a<0?"-":L[a]));
  for(var k=0;k<4;k++){var l=document.getElementById("l"+i+"_"+k);l.classList.remove("sel");l.querySelector("input").disabled=true;
   if(k===q[3])l.classList.add("right");else if(k===a)l.classList.add("wrong")}
  var d=document.createElement("div");d.className="ex"+(ok?"":" w");
  d.innerHTML=(ok?"<b>Correct.</b> ":"<b>"+(a<0?"Skipped":"Your answer: "+L[a])+". Correct: "+L[q[3]]+".</b> ")+q[4];
  document.getElementById("q"+i).appendChild(d);
 });
 var c=cor[0]+cor[1]+cor[2],pct=Math.round(100*c/Q.length);
 var pr=cor.map(function(x,s){return x/tot[s]});
 var best=pr.indexOf(Math.max.apply(null,pr)),worst=pr.indexOf(Math.min.apply(null,pr));
 var h="<div class=res><p class=big>"+c+" / "+Q.length+" ("+pct+"%)</p>";
 S.forEach(function(n,s){h+="<div>"+n+": "+cor[s]+" / "+tot[s]+"</div>"});
 h+="<p>Strongest: <b>"+S[best]+"</b>. Weakest: <b>"+S[worst]+"</b>.</p>";
 h+="<p>Missed items: "+(wrong.length?wrong.join(", "):"none")+"</p>";
 h+="<p>Copy this and send it to Claude for a full walkthrough and a targeted follow-up test:</p><textarea id=ans rows=3 readonly>"+str.join(", ")+"</textarea>";
 h+="<div class=row><button type=button id=cp>Copy my answers</button><button type=button class=alt id=rt>Retake</button></div></div>";
 var o=document.getElementById("out");o.innerHTML=h;
 document.getElementById("sub").style.display="none";
 document.getElementById("cp").onclick=function(){var t=document.getElementById("ans");t.select();try{document.execCommand("copy");this.textContent="Copied"}catch(e){this.textContent="Press and hold to copy"}};
 document.getElementById("rt").onclick=function(){location.reload()};
 o.scrollIntoView();
}
build();upd();
</script>
</body>
</html>
