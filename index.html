<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DOST-SEI Mock Exam (45 items)</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1c2321;--mute:#5d6a66;--line:#d9dfdb;--acc:#1f5f4a;--accbg:#e3f1ea;--ok:#1d7a3e;--okbg:#e2f4e8;--bad:#b3261e;--badbg:#fbe7e5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131816;--card:#1c2320;--ink:#e8ede9;--mute:#9aa8a2;--line:#2f3a36;--acc:#6fcfa5;--accbg:#1f3a2f;--ok:#6fd48f;--okbg:#1b3524;--bad:#ff8b82;--badbg:#3d2220}}
:root[data-theme="dark"]{--bg:#131816;--card:#1c2320;--ink:#e8ede9;--mute:#9aa8a2;--line:#2f3a36;--acc:#6fcfa5;--accbg:#1f3a2f;--ok:#6fd48f;--okbg:#1b3524;--bad:#ff8b82;--badbg:#3d2220}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:1.5rem;margin:8px 0 4px}
.sub{color:var(--mute);margin:0 0 12px;font-family:system-ui,sans-serif;font-size:.9rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;font-family:system-ui,sans-serif;font-size:.9rem}
.prog{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
h2{font-size:1.15rem;margin:28px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--acc)}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.q p{margin:0 0 8px}
.q b.n{color:var(--acc);margin-right:4px}
label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;margin:4px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-family:system-ui,sans-serif;font-size:.95rem}
label:hover{background:var(--accbg)}
input{margin-top:3px;accent-color:var(--acc)}
label.sel{background:var(--accbg);border-color:var(--acc)}
label.right{background:var(--okbg);border-color:var(--ok)}
label.wrong{background:var(--badbg);border-color:var(--bad)}
.ex{margin-top:8px;padding:8px 10px;border-left:3px solid var(--acc);background:var(--accbg);font-family:system-ui,sans-serif;font-size:.9rem}
.ex.w{border-color:var(--bad)}
button{font:600 1rem system-ui,sans-serif;padding:12px 20px;border-radius:8px;border:0;background:var(--acc);color:#fff;cursor:pointer}
:root:not([data-theme="light"]) button{color:#0b1a14}
button.alt{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.res{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:16px 0;font-family:system-ui,sans-serif}
.big{font-size:2rem;font-weight:700;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
textarea{width:100%;font:.9rem monospace;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-top:8px}
#msg{color:var(--bad);font-family:system-ui,sans-serif;margin-top:8px;min-height:1.2em}
</style>
</head>
<body>
<main>
<h1>DOST-SEI mock exam</h1>
<p class="sub">45 items, about 50 minutes. Practice set made by Claude, not actual DOST questions. Pick one answer per item, then submit everything at once. Use g = 10 m/s² where needed.</p>
<div class="bar"><span id="cnt">0/45 answered</span><div class="prog"><i id="pb"></i></div></div>
<form id="f" onsubmit="return false"></form>
<div id="msg"></div>
<div class="row"><button id="sub" type="button">Submit all answers</button></div>
<div id="out"></div>
</main>
<script>
var S=["Creative Reasoning and Language","Science","Mathematics"];
var Q=[
[0,"A 1.5 m crowbar has its fulcrum 0.3 m from a 600 N load. What force at the far end lifts it?",["100 N","150 N","200 N","300 N"],1,"Effort arm = 1.5 − 0.3 = 1.2 m. Load × load arm = effort × effort arm: 600 × 0.3 = F × 1.2, so F = 150 N."],
[0,"An ideal pulley system with 4 rope segments supports a 240 N load. What is the effort force?",["30 N","120 N","240 N","60 N"],3,"Ideal mechanical advantage = number of supporting segments = 4. Effort = 240 ÷ 4 = 60 N."],
[0,"Two identical bulbs are in series with a battery. If one burns out (open circuit), what happens to the other?",["It also goes out","Same brightness","Brighter","Dimmer but lit"],0,"Series means one path. A break stops current everywhere."],
[0,"Two identical bulbs are in parallel with an ideal battery. If one burns out, the other:",["Goes out","Gets dimmer","Stays the same brightness","Gets brighter"],2,"Each parallel branch gets the full battery voltage independently, so the other bulb is unchanged."],
[0,"Three meshed gears A, B, C are in a row. A turns clockwise. C turns:",["Clockwise","Counterclockwise","Not at all","Cannot be determined"],0,"Meshed gears alternate direction: A clockwise, B counterclockwise, C clockwise."],
[0,"A ball hangs from a string on the ceiling of a bus. The bus accelerates forward. Relative to the bus, the ball swings:",["Forward","Backward toward the rear","Stays vertical","Sideways"],1,"Inertia: the ball resists the change in motion, so it lags toward the rear."],
[0,"How many faces, edges, and vertices does a triangular prism have (in that order)?",["4, 6, 4","6, 9, 5","5, 8, 5","5, 9, 6"],3,"2 triangles + 3 rectangles = 5 faces. Edges: 3 + 3 + 3 = 9. Vertices: 3 + 3 = 6."],
[0,"Complete the series: 2, 6, 12, 20, 30, ___",["36","40","42","44"],2,"Differences are 4, 6, 8, 10, so the next is +12: 30 + 12 = 42. (Also n(n+1): 6 × 7.)"],
[0,"A square paper is folded in half twice (4 layers). One hole is punched through all layers, away from the folds. How many holes show when it is unfolded?",["4","1","2","8"],0,"Each layer gets one hole, so 4 layers give 4 holes."],
[0,"You face north, turn 90° right, then 180°, then 90° left. Which way do you face now?",["North","West","South","East"],2,"North → right 90° = East → turn 180° = West → left 90° (from West) = South."],
[0,"THERMOMETER : TEMPERATURE :: ODOMETER : ?",["speed","distance","fuel","time"],1,"A thermometer measures temperature. An odometer measures distance traveled (a speedometer measures speed)."],
[0,"PETAL : FLOWER :: PAGE : ?",["ink","word","author","book"],3,"Part to whole: a petal is part of a flower, a page is part of a book."],
[0,"Did Maria really ___ the last slice of pizza?",["eat","ate","eaten","eats"],0,"After the auxiliary did, the main verb stays in base form: eat."],
[0,"“The scientist was meticulous, checking every measurement twice.” Meticulous means:",["careless","very careful","quick","proud"],1,"The context clue (checking twice) shows careful attention to detail."],
[0,"Which sentence has correct subject-verb agreement?",["The group of students are late.","Each of the boys have a bike.","Everyone in the class has finished.","Neither of them are ready."],2,"Everyone, each, and neither are singular and take singular verbs: has, has, is. Only C is correct."],
[1,"A 1000 kg car speeds up uniformly from rest to 20 m/s in 10 s. What is the net force?",["200 N","20,000 N","2,000 N","1,000 N"],2,"a = 20 ÷ 10 = 2 m/s². F = ma = 1000 × 2 = 2,000 N."],
[1,"How much work is done lifting a 5 kg object 4 m at constant speed?",["20 J","200 J","50 J","2,000 J"],1,"W = mgh = 5 × 10 × 4 = 200 J."],
[1,"At the highest point of a projectile’s path (no air resistance):",["vertical velocity = 0 and acceleration = 0","the velocity is zero","vertical velocity = 0 and acceleration = 10 m/s² downward","horizontal velocity = 0 and acceleration = 10 m/s² downward"],2,"Gravity never stops acting, so a = g downward. Only the vertical velocity is zero; horizontal velocity stays constant."],
[1,"If a moving object doubles its speed, its kinetic energy becomes:",["4 times","2 times","8 times","unchanged"],0,"KE = ½mv². Speed is squared, so 2² = 4 times."],
[1,"A 2 kg cart moving at 3 m/s hits a 1 kg cart at rest and they stick together. Their speed afterward is:",["1 m/s","1.5 m/s","3 m/s","2 m/s"],3,"Momentum is conserved: 2 × 3 = (2 + 1)v, so v = 6 ÷ 3 = 2 m/s."],
[1,"How many moles are in 36 g of water (H₂O, 18 g/mol)?",["0.5","2","1","4"],1,"moles = mass ÷ molar mass = 36 ÷ 18 = 2."],
[1,"A chlorine atom has atomic number 17 and mass number 35. How many neutrons does it have?",["17","35","52","18"],3,"Neutrons = mass number − atomic number = 35 − 17 = 18."],
[1,"Carbon-14 has a half-life of 5730 years. How much of a 20 g sample remains after 11,460 years?",["10 g","7.5 g","5 g","2.5 g"],2,"11,460 ÷ 5730 = 2 half-lives. 20 → 10 → 5 g."],
[1,"0.5 mol of NaCl is dissolved to make 250 mL of solution. What is the molarity?",["0.5 M","1.0 M","125 M","2.0 M"],3,"250 mL = 0.25 L. M = 0.5 ÷ 0.25 = 2.0 M."],
[1,"A red blood cell is placed in a hypertonic solution. It will:",["Swell and burst","Shrink","Stay the same","Divide"],1,"Hypertonic means more solute outside, so water leaves the cell and it shrinks."],
[1,"In a cross of Aa × Aa, what is the probability of an offspring with genotype aa?",["0","1/2","3/4","1/4"],3,"Punnett square gives AA, Aa, Aa, aa, so aa = 1/4."],
[1,"A cell with 12 chromosomes undergoes mitosis. How many chromosomes does each daughter cell have?",["6","24","12","3"],2,"Mitosis makes identical cells, so the chromosome number stays 12. (Meiosis would halve it.)"],
[1,"The Mid-Atlantic Ridge is an example of a ______ plate boundary.",["divergent","convergent","transform","subduction"],0,"Mid-ocean ridges form where plates move apart and new crust is made: divergent."],
[1,"Marble forms when heat and pressure change which rock?",["Sandstone","Shale","Granite","Limestone"],3,"Limestone becomes marble. (Shale becomes slate, sandstone becomes quartzite.)"],
[1,"Our Sun will end its life as a:",["black hole","white dwarf","supernova","neutron star"],1,"The Sun is too small for a supernova. It becomes a red giant, then a white dwarf."],
[2,"Ana is 3 times as old as Ben. In 6 years, the sum of their ages will be 36. How old is Ana now?",["6","12","24","18"],3,"Let Ben = b, Ana = 3b. (3b + 6) + (b + 6) = 36, so 4b = 24, b = 6. Ana = 18."],
[2,"What is the sum of the roots of 2x² − 10x + 8 = 0?",["4","5","−5","10"],1,"Sum of roots = −b/a = 10/2 = 5."],
[2,"Solve: log₂ x + log₂ (x − 2) = 3",["−2","2","8","4"],3,"x(x − 2) = 2³ = 8, so x² − 2x − 8 = 0, giving x = 4 or −2. Reject −2 (log of a negative). x = 4."],
[2,"An arithmetic sequence has a₁ = 5 and d = 3. What is the 20th term?",["57","62","60","65"],1,"aₙ = a₁ + (n − 1)d = 5 + 19 × 3 = 62."],
[2,"Pipe A fills a tank in 6 hours and Pipe B fills it in 3 hours. How long will both take together?",["1.5 h","3 h","2 h","4.5 h"],2,"Rates add: 1/6 + 1/3 = 1/2 tank per hour, so 2 hours."],
[2,"What is the sum of the interior angles of a hexagon?",["540°","720°","900°","1080°"],1,"(n − 2) × 180 = 4 × 180 = 720°."],
[2,"Two chords intersect inside a circle, forming an angle that intercepts arcs of 80° and 40°. What is the angle?",["40°","120°","60°","30°"],2,"Angle inside a circle = ½(sum of intercepted arcs) = ½(80 + 40) = 60°."],
[2,"What is the volume of a cylinder with radius 3 and height 10?",["30π","60π","270π","90π"],3,"V = πr²h = π × 9 × 10 = 90π."],
[2,"What is sin 30° + cos 60°?",["1/2","1","√3/2","√3"],1,"sin 30° = 1/2 and cos 60° = 1/2, so the sum is 1."],
[2,"In a right triangle, the side opposite θ is 5 and the hypotenuse is 13. What is cos θ?",["5/12","5/13","12/13","13/12"],2,"Adjacent = √(13² − 5²) = 12. cos θ = adjacent/hypotenuse = 12/13."],
[2,"What is the median of 3, 9, 5, 7, 11, 13?",["7","9","8","8.5"],2,"Sorted: 3, 5, 7, 9, 11, 13. Six values, so average the middle two: (7 + 9)/2 = 8."],
[2,"Two fair dice are rolled. What is the probability that the sum is 7?",["1/12","1/6","1/9","1/4"],1,"Six ways (1-6, 2-5, 3-4, 4-3, 5-2, 6-1) out of 36 = 1/6."],
[2,"How many 3-digit codes can be made from the digits 1–5 with no repeated digit?",["10","15","125","60"],3,"Order matters (permutation): 5 × 4 × 3 = 60."],
[2,"Evaluate: lim (x → 3) (x² − 9)/(x − 3)",["6","0","3","Does not exist"],0,"Factor: (x − 3)(x + 3)/(x − 3) = x + 3, which is 6 at x = 3."],
[2,"Evaluate: ∫₀² 4x³ dx",["8","32","16","4"],2,"Antiderivative is x⁴. At 2: 16, at 0: 0. Answer 16."]
];
var L="ABCD",A=new Array(Q.length).fill(-1),done=false;
var f=document.getElementById("f");
function build(){
 var h="",cur=-1;
 Q.forEach(function(q,i){
  if(q[0]!==cur){cur=q[0];h+="<h2>Part "+(cur+1)+": "+S[cur]+"</h2>"}
  h+="<div class=q id=q"+i+"><p><b class=n>"+(i+1)+".</b>"+q[1]+"</p>";
  q[2].forEach(function(o,j){h+="<label id=l"+i+"_"+j+"><input type=radio name=r"+i+" value="+j+"> <span><b>"+L[j]+".</b> "+o+"</span></label>"});
  h+="</div>";
 });
 f.innerHTML=h;
}
function upd(){
 var n=A.filter(function(x){return x>=0}).length;
 document.getElementById("cnt").textContent=n+"/"+Q.length+" answered";
 document.getElementById("pb").style.width=(100*n/Q.length)+"%";
}
f.addEventListener("change",function(e){
 if(done)return;
 var t=e.target,i=+t.name.slice(1),j=+t.value;A[i]=j;
 for(var k=0;k<4;k++)document.getElementById("l"+i+"_"+k).classList.toggle("sel",k===j);
 upd();
});
document.getElementById("sub").onclick=function(){
 if(done)return;
 var un=[];A.forEach(function(a,i){if(a<0)un.push(i+1)});
 var m=document.getElementById("msg");
 if(un.length&&!window._ok){m.textContent="Unanswered: "+un.join(", ")+". Guessing costs nothing on the real exam. Press Submit again to grade anyway.";window._ok=true;return}
 m.textContent="";grade();
};
function grade(){
 done=true;
 var tot=[0,0,0],cor=[0,0,0],wrong=[],str=[];
 Q.forEach(function(q,i){
  var s=q[0];tot[s]++;var a=A[i],ok=a===q[3];if(ok)cor[s]++;else wrong.push(i+1);
  str.push((i+1)+(a<0?"-":L[a]));
  for(var k=0;k<4;k++){var l=document.getElementById("l"+i+"_"+k);l.classList.remove("sel");l.querySelector("input").disabled=true;
   if(k===q[3])l.classList.add("right");else if(k===a)l.classList.add("wrong")}
  var d=document.createElement("div");d.className="ex"+(ok?"":" w");
  d.innerHTML=(ok?"<b>Correct.</b> ":"<b>"+(a<0?"Skipped":"Your answer: "+L[a])+". Correct: "+L[q[3]]+".</b> ")+q[4];
  document.getElementById("q"+i).appendChild(d);
 });
 var c=cor[0]+cor[1]+cor[2],pct=Math.round(100*c/Q.length);
 var pr=cor.map(function(x,s){return x/tot[s]});
 var best=pr.indexOf(Math.max.apply(null,pr)),worst=pr.indexOf(Math.min.apply(null,pr));
 var h="<div class=res><p class=big>"+c+" / "+Q.length+" ("+pct+"%)</p>";
 S.forEach(function(n,s){h+="<div>"+n+": "+cor[s]+" / "+tot[s]+"</div>"});
 h+="<p>Strongest: <b>"+S[best]+"</b>. Weakest: <b>"+S[worst]+"</b>.</p>";
 h+="<p>Missed items: "+(wrong.length?wrong.join(", "):"none")+"</p>";
 h+="<p>Copy this and send it to Claude for a full walkthrough and a targeted follow-up test:</p><textarea id=ans rows=3 readonly>"+str.join(", ")+"</textarea>";
 h+="<div class=row><button type=button id=cp>Copy my answers</button><button type=button class=alt id=rt>Retake</button></div></div>";
 var o=document.getElementById("out");o.innerHTML=h;
 document.getElementById("sub").style.display="none";
 document.getElementById("cp").onclick=function(){var t=document.getElementById("ans");t.select();try{document.execCommand("copy");this.textContent="Copied"}catch(e){this.textContent="Press and hold to copy"}};
 document.getElementById("rt").onclick=function(){location.reload()};
 o.scrollIntoView();
}
build();upd();
</script>
</body>
</html>
