.q p{margin:0 0 8px}
.q b.n{color:var(--acc);margin-right:4px}
.tag{display:inline-block;font:600 .7rem system-ui,sans-serif;color:var(--acc);background:var(--accbg);border-radius:10px;padding:1px 8px;margin-left:6px;vertical-align:middle}

label:hover{background:var(--accbg)}
input{margin-top:3px;accent-color:var(--acc)}
label.sel{background:var(--accbg);border-color:var(--acc)}
label.right{background:var(--okbg);border-color:var(--ok)}
label.wrong{background:var(--badbg);border-color:var(--bad)}
.ex{margin-top:8px;padding:8px 10px;border-left:3px solid var(--acc);background:var(--accbg);font-family:system-ui,sans-serif;font-size:.9rem}
.ex.w{border-color:var(--bad)}
button{font:600 1rem system-ui,sans-serif;padding:12px 20px;border-radius:8px;border:0;background:var(--acc);color:#fff;cursor:pointer}
:root:not([data-theme="light"]) button{color:#0b1a14}
button.alt{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.res,.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:16px 0;font-family:system-ui,sans-serif}
.big{font-size:2rem;font-weight:700;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
textarea{width:100%;font:.9rem monospace;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-top:8px}
#msg{color:var(--bad);font-family:system-ui,sans-serif;margin-top:8px;min-height:1.2em}
.soon{color:var(--mute);font-family:system-ui,sans-serif;padding:20px 4px}
.refs{font-family:system-ui,sans-serif;font-size:.8rem;color:var(--mute);margin-top:24px}
</style>

  var un=A.filter(function(a){return a<0}).length;
  if(!ok1){ok1=true;document.getElementById("msg").textContent=(un?un+" unanswered. ":"")+"Press Submit again to finish the exam.";return}
  grade();
 };
 show(0);
 iv=setInterval(function(){left--;var t=document.getElementById("tm");if(t)t.textContent=fmt(left);var b=document.getElementById("bar");if(b)b.classList.toggle("warn",left<=600);if(left<=0)grade()},1000);
}
function show(s){
 cur=s;
 document.getElementById("tabs").innerHTML=SEC.map(function(x,i){var d=ids(i).filter(function(k){return A[k]>=0}).length;return "<button type=button class='"+(i===s?"on":"")+"' data-s="+i+">"+x.n+" "+d+"/"+(x.e-x.s+1)+"</button>"}).join("");
 var h="<h2>"+(s+1)+" · "+SEC[s].t+" (items "+SEC[s].s+"–"+SEC[s].e+")</h2>",list=ids(s);
 if(!list.length)h+="<p class=soon>These questions are still being added to this exam. Ask Claude to continue and they will appear here.</p>";
 list.forEach(function(i){
  var q=Q[i];
  h+="<div class=q><p><b class=n>"+NUM[i]+".</b>"+q[2]+"<span class=tag>"+q[1]+"</span></p>";
  q[3].forEach(function(o,j){h+="<label class='"+(A[i]===j?"sel":"")+"' id=l"+i+"_"+j+"><input type=radio name=r"+i+" value="+j+(A[i]===j?" checked":"")+"> <span><b>"+L[j]+".</b> "+o+"</span></label>"});
  h+="</div>";
 });
 var el=document.getElementById("sec");el.innerHTML=h;
 el.onchange=function(e){var t=e.target,i=+t.name.slice(1),j=+t.value;A[i]=j;for(var k=0;k<4;k++)document.getElementById("l"+i+"_"+k).classList.toggle("sel",k===j);cnt();tabsCount()};
 document.getElementById("tabs").onclick=function(e){var b=e.target.closest("button");if(b){show(+b.dataset.s);window.scrollTo(0,0)}};
 cnt();
}
function tabsCount(){var bs=document.querySelectorAll("#tabs button");SEC.forEach(function(x,i){var d=ids(i).filter(function(k){return A[k]>=0}).length;bs[i].textContent=x.n+" "+d+"/"+(x.e-x.s+1)})}
function cnt(){document.getElementById("cnt").textContent=A.filter(function(a){return a>=0}).length+"/"+Q.length+" answered"}
function grade(){
 clearInterval(iv);
 var tot=[0,0,0,0],cor=[0,0,0,0],str=[],miss={},wrong=0;
 Q.forEach(function(q,i){var s=q[0],a=A[i],ok=a===q[4];tot[s]++;if(ok)cor[s]++;else{wrong++;miss[q[1]]=(miss[q[1]]||0)+1}str.push(NUM[i]+(a<0?"-":L[a]))});
 var c=cor.reduce(function(x,y){return x+y},0),pct=Math.round(100*c/Q.length);
 var act=[0,1,2,3].filter(function(s){return tot[s]>0}),pr=act.map(function(s){return cor[s]/tot[s]});
 var best=act[pr.indexOf(Math.max.apply(null,pr))],worst=act[pr.indexOf(Math.min.apply(null,pr))];
 var mt=Object.keys(miss).sort(function(a,b){return miss[b]-miss[a]}).map(function(k){return k+" ("+miss[k]+")"}).join(", ");
 var h="<h1>Results</h1><div class=res><p class=big>"+c+" / "+Q.length+" ("+pct+"%)</p>";
 act.forEach(function(s){h+="<div>"+SEC[s].n+" · "+SEC[s].t+": "+cor[s]+" / "+tot[s]+" ("+Math.round(100*cor[s]/tot[s])+"%)</div>"});
 h+="<p>Strongest: <b>"+SEC[best].n+"</b>. Weakest: <b>"+SEC[worst].n+"</b>. Time left: "+fmt(left)+".</p><p>Topics to review: "+(mt||"none, great job")+"</p>";
 h+="<p>Copy this and send it to Claude for a walkthrough and a targeted follow-up:</p><textarea id=ans rows=4 readonly>"+str.join(", ")+"</textarea><div class=row><button type=button id=cp>Copy my answers</button><button type=button class=alt id=rt>Retake</button></div></div>";
 var cs=-1;
 Q.forEach(function(q,i){
  if(q[0]!==cs){cs=q[0];h+="<h2>"+(cs+1)+" · "+SEC[cs].t+"</h2>"}
  var a=A[i],ok=a===q[4];
  h+="<div class=q><p><b class=n>"+NUM[i]+".</b>"+q[2]+"<span class=tag>"+q[1]+"</span></p>";
  q[3].forEach(function(o,j){h+="<label class='"+(j===q[4]?"right":(j===a?"wrong":""))+"'><span><b>"+L[j]+".</b> "+o+"</span></label>"});
  h+="<div class='ex"+(ok?"":" w")+"'>"+(ok?"<b>Correct.</b> ":"<b>"+(a<0?"Skipped":"Your answer: "+L[a])+". Correct: "+L[q[4]]+".</b> ")+q[5]+"</div></div>";
 });
 app.innerHTML=h+REFS;window.scrollTo(0,0);
 document.getElementById("cp").onclick=function(){var t=document.getElementById("ans");t.select();try{document.execCommand("copy");this.textContent="Copied"}catch(e){this.textContent="Press and hold to copy"}};
 document.getElementById("rt").onclick=function(){location.reload()};
}
intro();
</script>
</body>
</html>
